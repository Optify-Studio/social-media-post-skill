<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 400px 500px; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 400px; height: 500px; }
    body { padding: 36px; background: #142b27; color: #f5f3e9; font-family: Arial, sans-serif; print-color-adjust: exact; }
    .label { color: #a8e5a1; font-size: 14px; letter-spacing: 2px; }
    h1 { font-size: 42px; line-height: 1.05; margin: 28px 0 18px; }
    p { font-size: 18px; line-height: 1.4; }
    .bar { height: 14px; background: #a8e5a1; border-radius: 8px; margin-top: 35px; width: 75%; }
    .note { font-size: 13px; margin-top: 9px; }
  </style>
</head>
<body>
  <div class="label">SAMPLE INFOGRAPHIC</div>
  <h1>Make space<br>for good ideas.</h1>
  <p>A simple test graphic for the social media post skill.</p>
  <div class="bar"></div>
  <div class="note">Illustrative graphic — not a statistic</div>
</body>
</html>
